name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The runner image ships Apple's bash 3.2; the hooks and their suites want 5.
      - if: runner.os == 'macOS'
        run: brew install bash

      - run: bash --version | head -1

      - run: bash .claude/hooks/put-gnu-tools-on-path.test.sh
      - run: bash .claude/hooks/warn-shell-not-bash.test.sh
      - run: bash .claude/hooks/warn-old-bash.test.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck .claude/hooks/*.sh
